name: build

# Runs on the owner's self-hosted runners (labels: self-hosted + Linux /
# macOS). Kext + host tests run on every push, the Metal plugin and RADV
# only when their sources change (or on a manual run with "full"),
# docs-only pushes run nothing, and a newer push cancels an older run of
# the same branch. No pull_request trigger: fork code never reaches the
# self-hosted machines.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'NOTICE'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      full:
        description: 'Build everything (Metal plugin + RADV too)'
        type: boolean
        default: true
      radv:
        description: 'With full off: build RADV + rdna3_vktest too (no Metal plugin)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, Linux]
    outputs:
      metal: ${{ steps.f.outputs.metal }}
      radv: ${{ steps.f.outputs.radv }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          RADV: ${{ inputs.radv }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" != "true" ]; then
            echo "metal=false" >> "$GITHUB_OUTPUT"
            [ "$RADV" = "true" ] && echo "radv=true" >> "$GITHUB_OUTPUT" || echo "radv=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FULL" = "true" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "metal=true" >> "$GITHUB_OUTPUT"; echo "radv=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)
          echo "$changed"
          echo "$changed" | grep -qE '^metal/' && echo "metal=true" >> "$GITHUB_OUTPUT" || echo "metal=false" >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -qE '^(userspace/|third_party/libdrm/)' && echo "radv=true" >> "$GITHUB_OUTPUT" || echo "radv=false" >> "$GITHUB_OUTPUT"

  host-tests:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Navi 32 firmware for header tests (not redistributed)
        run: |
          mkdir -p "$RUNNER_TEMP/fw"
          for f in psp_13_0_10_sos psp_13_0_10_ta smu_13_0_10 sdma_6_0_3 gc_11_0_3_imu gc_11_0_3_pfp \
                   gc_11_0_3_me gc_11_0_3_mec gc_11_0_3_rlc gc_11_0_3_mes_2 \
                   gc_11_0_3_mes1 dcn_3_2_0_dmcub vcn_4_0_0; do
            curl -sSfL "https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/amdgpu/$f.bin" \
                 -o "$RUNNER_TEMP/fw/$f.bin" || echo "could not fetch $f"
          done
      - name: Unit tests + fuzz (ASan/UBSan), real firmware headers
        run: make test RDNA3_FW_DIR="$RUNNER_TEMP/fw"
      - name: Firmware load plan
        run: make tools && build/host/amd_fw_dump "$RUNNER_TEMP/fw"
      - name: Host tools
        run: make tools
      - name: README status is up to date
        run: python3 tools/progress.py --check

  kext:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - name: Build RDNA3Accel.kext (x86_64)
        run: make -k -C kext   # -k: one run lists every compile error
      - name: Build RDNA3Accelerator.kext (Stage 7, Sequoia and Tahoe layouts)
        run: |
          make -C accel
          make -C accel check
          make -C accel clean && make -C accel NM_TAHOE=1
          make -C accel clean && make -C accel
      - name: Build RDNA3Framebuffer.kext (Stage 3)
        run: |
          make -C fb
          make -C fb check
      - name: Inspect
        run: |
          file build/RDNA3Accel.kext/Contents/MacOS/RDNA3Accel
          make -C kext check
      - name: Userspace (libdrm_xnu, rdna3_drminfo, rdna3_modetest, rdna3_pmctl)
        run: make -C userspace
      - name: rdna3_vktest + mtlprobe (bundled into the VM's report bin)
        continue-on-error: true
        run: make -C userspace probes
      - name: Host tests on macOS
        run: make test tools
      - uses: actions/upload-artifact@v4
        with:
          name: RDNA3Accel-kext
          path: |
            build/RDNA3Accel.kext
            build/RDNA3Accelerator.kext
            build/RDNA3Framebuffer.kext
            build/userspace/rdna3_drminfo
            build/userspace/rdna3_modetest
            build/userspace/rdna3_pmctl
            build/userspace/rdna3_vktest
            build/userspace/mtlprobe
            build/userspace/libdrm.dylib
            build/userspace/libdrm_amdgpu.dylib
      # seconds: pkgbuild over the files above, no firmware inside
      # (package/make_pkg.sh; the Metal plugin and RADV are added locally)
      - name: Installer (.pkg + tarball)
        continue-on-error: true
        run: package/make_pkg.sh --out build/pkg
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RDNA3-pkg
          path: build/pkg/
          if-no-files-found: ignore

  metal:
    needs: changes
    if: needs.changes.outputs.metal == 'true'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Metal plugin (RDNA3MTLDriver.bundle)
        run: make -C metal plugin
      - name: AIR->SPIR-V translator (librdna3mtl_translate.dylib)
        run: |
          rustup target add x86_64-apple-darwin
          make -C metal translator CARGO_BUILD_TARGET=x86_64-apple-darwin || make -C metal translator
      - uses: actions/upload-artifact@v4
        with:
          name: RDNA3MTL
          path: |
            build/metal/RDNA3MTLDriver.bundle
            build/metal/librdna3mtl_translate.dylib

  radv-macos:
    # Experimental: drives the Stage 5 port. Failures here are the to-do list.
    # Builds x86_64 (-arch x86_64); the loopback vulkaninfo step needs an
    # Intel Mac or an x86_64 vulkaninfo under Rosetta.
    needs: changes
    if: needs.changes.outputs.radv == 'true'
    runs-on: [self-hosted, macOS]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install meson ninja glslang pkgconf || true
          # a venv, not the runner machine's own Python
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install mako pyyaml packaging
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build RADV against libdrm_xnu
        run: userspace/mesa/build_radv.sh build/mesa
      - name: rdna3_vktest (the VM runs it against the card from step 8)
        run: |
          mkdir -p build/mesa/install/bin
          xcrun clang -O1 -g -arch x86_64 -mmacosx-version-min=15.0 -std=gnu11 -Wall -Wextra -Werror \
            -I build/mesa/src/include -o build/mesa/install/bin/rdna3_vktest userspace/rdna3_vktest.c
      - name: vulkaninfo on the in-process UAPI (loopback libdrm, no kext)
        if: always()
        run: |
          brew install vulkan-loader vulkan-tools || true
          make -C userspace loopback
          cp build/userspace/libdrm_loopback.dylib build/userspace/prefix/lib/libdrm.2.dylib
          export VK_ICD_FILENAMES="$PWD/build/mesa/install/share/vulkan/icd.d/radeon_icd.x86_64.json"
          export VK_LOADER_DEBUG=error,warn
          export DRM_XNU_TRACE=1
          vulkaninfo --summary 2>&1 | tee build/mesa/vulkaninfo.log | head -120
          grep -q "RADV" build/mesa/vulkaninfo.log && echo "RADV enumerated through the loopback UAPI" || echo "vulkaninfo did not enumerate RADV (see log)"
          build/mesa/install/bin/rdna3_vktest --loopback build/mesa/install/lib/libvulkan_radeon.dylib 2>&1 \
            | tee build/mesa/vktest.log || true
      - name: Error summary
        if: always()
        run: |
          grep -E "error:|ERROR:|meson.build:[0-9]+:[0-9]+: ERROR" build/mesa/meson-setup.log build/mesa/ninja.log 2>/dev/null | sort | uniq -c | sort -rn | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radv-macos-logs
          path: |
            build/mesa/meson-setup.log
            build/mesa/ninja.log
            build/mesa/install/lib/libvulkan_radeon.dylib
            build/mesa/install/bin/rdna3_vktest
            build/mesa/install/share/vulkan/icd.d
            build/mesa/missing.txt
            build/mesa/weak.txt
            build/mesa/vulkaninfo.log
            build/mesa/vktest.log
