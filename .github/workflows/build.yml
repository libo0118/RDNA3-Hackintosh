name: Experimental RX7600XT source validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Offline host tests (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record scope and host toolchain
        run: |
          mkdir -p build/ci-logs
          printf '%s\n' \
            'EXPERIMENTAL: source validation only; RX7600XT/Navi33 hardware is NOT verified.' \
            'This job has no GPU, kext loading, boot, DisplayPort, Metal, RADV or real-firmware validation.' \
            'This job downloads no firmware. test_fw and sim_navi32 skip real Navi32 firmware subcases; synthetic tests still run.' \
            | tee build/ci-logs/EXPERIMENTAL.txt >> "$GITHUB_STEP_SUMMARY"
          clang --version 2>&1 | tee build/ci-logs/toolchain.log
          python3 --version 2>&1 | tee -a build/ci-logs/toolchain.log
          make --version 2>&1 | tee -a build/ci-logs/toolchain.log
      - name: Unit tests and synthetic models (ASan/UBSan)
        run: |
          echo '::notice::Offline mode: real-firmware subcases are intentionally skipped, not hardware passes.'
          make test CC=clang JOBS=4 RDNA3_FW_DIR= 2>&1 | tee build/ci-logs/host-tests.log
      - name: Compile portable host tools
        run: make tools CC=clang 2>&1 | tee build/ci-logs/host-tools.log
      - name: Preserve test and compiler logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-ubuntu-host-logs
          path: |
            build/ci-logs/
            build/test-logs/
          if-no-files-found: error
          retention-days: 7

  wifi-cli:
    name: MT7925 connection tool (macOS x86_64, compile only)
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Fetch the exact source matching the USB wireless driver
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            https://codeload.github.com/watchthelight-labs/WTLMtkWireless/legacy.zip/0ea306289654c7fcb1a9348f971f385cf906b822 \
            --output "$RUNNER_TEMP/mtkwlan.zip"
          printf '%s  %s\n' d7577531e4ed6dd70fc301c3d7f6c525151fd7a41029902a208e6450774c9e98 "$RUNNER_TEMP/mtkwlan.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/mtkwlan.zip" -d "$RUNNER_TEMP/mtkwlan"
      - name: Compile and ad-hoc sign the CLI without running it
        run: |
          src="$RUNNER_TEMP/mtkwlan/watchthelight-labs-WTLMtkWireless-0ea3062"
          out="$RUNNER_TEMP/mtkwifi-artifact"
          mkdir -p "$out"
          xcrun clang -std=c11 -O2 -arch x86_64 -mmacosx-version-min=10.15 \
            -Wall -Wextra -Wno-unused-parameter -I"$src/src" \
            "$src/tools/mtkwifi/mtkwifi.c" "$src/src/MtkCrypto.c" \
            -framework IOKit -framework CoreFoundation -o "$out/mtkwifi"
          codesign --force --sign - "$out/mtkwifi"
          codesign --verify --strict "$out/mtkwifi"
          test "$(lipo -archs "$out/mtkwifi")" = x86_64
          cp "$src/LICENSE" "$out/LICENSE"
          cp "$src/tools/mtkwifi/README.md" "$out/README-upstream.md"
          printf '%s\n' \
            'WTLMtkWireless 0.12.1 / 0ea306289654c7fcb1a9348f971f385cf906b822' \
            'Source: https://github.com/watchthelight-labs/WTLMtkWireless' \
            'Compiled only; wireless connectivity and WPA2 are NOT verified.' \
            'No installer or LaunchDaemon has been run.' > "$out/BUILD-SCOPE.txt"
          (cd "$out" && shasum -a 256 mtkwifi > SHA256SUMS)
      - name: Preserve the connection tool and attribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mtkwifi-0.12.1-macos-x86_64
          path: ${{ runner.temp }}/mtkwifi-artifact/
          if-no-files-found: error
          retention-days: 7

  firmware-headers:
    name: ${{ matrix.chip }} firmware headers (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        chip: [navi32, navi33]
    env:
      CHIP: ${{ matrix.chip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile the firmware parser and record validation scope
        run: |
          mkdir -p build/ci-logs
          printf '%s\n' \
            "EXPERIMENTAL: download and parse pinned linux-firmware headers for $CHIP; no GPU or microcode execution." \
            'Incomplete downloads or parser failures fail this job; they are never counted as skips.' \
            'Only logs are uploaded, never firmware blobs. Hardware, boot, DisplayPort and Metal remain unverified.' \
            | tee build/ci-logs/EXPERIMENTAL.txt >> "$GITHUB_STEP_SUMMARY"
          make tools CC=clang 2>&1 | tee build/ci-logs/host-tools.log
      - name: Download and require the complete verified firmware set
        run: |
          sh tools/ci/fetch_fw.sh "$RUNNER_TEMP/fw" "$CHIP" 2>&1 | tee build/ci-logs/firmware-fetch.log
          test -f "$RUNNER_TEMP/fw/.complete" || { echo "::error::Incomplete verified firmware set for $CHIP"; exit 1; }
      - name: Parse the selected chip's real firmware headers
        run: |
          build/host/amd_fw_dump "$RUNNER_TEMP/fw" "$CHIP" 2>&1 | tee build/ci-logs/firmware-headers.log
      - name: Preserve firmware validation logs (no blobs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-${{ matrix.chip }}-firmware-header-logs
          path: build/ci-logs/
          if-no-files-found: error
          retention-days: 7

  macos-compile:
    name: macOS 15 Intel x86_64 compile (not hardware validation)
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require macOS 15 Intel and the macOS 15 SDK
        run: |
          mkdir -p build/ci-logs
          printf '%s\n' \
            'EXPERIMENTAL: compilation only; RX7600XT/Navi33 hardware is NOT verified.' \
            "Commit: $GITHUB_SHA" \
            'No kext is installed or loaded. No boot, DisplayPort, Metal, RADV or real-firmware validation.' \
            'Only the macOS 15 accelerator layout is compiled. Accelerator unresolved imports are reported, not validated.' \
            'Metal plugin/translator, Vulkan probes, RADV, CTS and installers are outside this CI; firmware headers are checked in separate jobs.' \
            | tee build/ci-logs/EXPERIMENTAL.txt >> "$GITHUB_STEP_SUMMARY"
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" = 15
          test -d "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/Kernel.framework/Headers"
          sw_vers 2>&1 | tee build/ci-logs/toolchain.log
          xcodebuild -version 2>&1 | tee -a build/ci-logs/toolchain.log
          xcrun --sdk macosx --show-sdk-path 2>&1 | tee -a build/ci-logs/toolchain.log
          xcrun clang --version 2>&1 | tee -a build/ci-logs/toolchain.log
      - name: Compile and inspect the four x86_64 kexts
        run: |
          make -C kext all check 2>&1 | tee build/ci-logs/kext.log
          make -C accel all check 2>&1 | tee build/ci-logs/accel.log
          make -C fb all check 2>&1 | tee build/ci-logs/fb.log
          make -C agdc all check 2>&1 | tee build/ci-logs/agdc.log
      - name: Strict KPI guards (core, framebuffer and AGDC)
        run: |
          python3 tools/ci/kmutil_kpi_guard.py \
            build/RDNA3Accel.kext build/RDNA3Framebuffer.kext build/RDNA3AGDC.kext \
            2>&1 | tee build/ci-logs/kpi-strict.log
      - name: Accelerator import report (unresolved imports are not verified)
        # Upstream's macOS 15 layout relies on OpenCore binding non-exported IOAcceleratorFamily2 symbols.
        run: |
          python3 tools/ci/kmutil_kpi_guard.py --warn-unresolved build/RDNA3Accelerator.kext \
            2>&1 | tee build/ci-logs/kpi-accelerator-report.log
      - name: Compile native libdrm and diagnostic tools (do not run against a GPU)
        run: make -C userspace 2>&1 | tee build/ci-logs/userspace.log
      - name: Verify architecture and package only binaries and plists (no firmware)
        run: |
          for binary in build/*.kext/Contents/MacOS/* \
            build/userspace/libdrm.dylib build/userspace/libdrm_amdgpu.dylib \
            build/userspace/rdna3_drminfo build/userspace/rdna3_modetest build/userspace/rdna3_pmctl; do
            file "$binary"
            test "$(lipo -archs "$binary")" = x86_64 || exit 1
          done 2>&1 | tee build/ci-logs/architectures.log
          cp build/userspace/libdrm.dylib build/userspace/libdrm.2.dylib
          cp build/userspace/libdrm_amdgpu.dylib build/userspace/libdrm_amdgpu.1.dylib
          tar -czf build/rdna3-experimental-macos15-x86_64-NOT-HARDWARE-VERIFIED.tar.gz -C build \
            ci-logs/EXPERIMENTAL.txt \
            RDNA3Accel.kext/Contents/Info.plist RDNA3Accel.kext/Contents/MacOS/RDNA3Accel \
            RDNA3Accelerator.kext/Contents/Info.plist RDNA3Accelerator.kext/Contents/MacOS/RDNA3Accelerator \
            RDNA3Framebuffer.kext/Contents/Info.plist RDNA3Framebuffer.kext/Contents/MacOS/RDNA3Framebuffer \
            RDNA3AGDC.kext/Contents/Info.plist RDNA3AGDC.kext/Contents/MacOS/RDNA3AGDC \
            userspace/libdrm.dylib userspace/libdrm_amdgpu.dylib \
            userspace/libdrm.2.dylib userspace/libdrm_amdgpu.1.dylib \
            userspace/rdna3_drminfo userspace/rdna3_modetest userspace/rdna3_pmctl
      - name: Preserve experimental binaries (NOT HARDWARE VERIFIED)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-macos15-x86_64-NOT-HARDWARE-VERIFIED
          path: build/rdna3-experimental-macos15-x86_64-NOT-HARDWARE-VERIFIED.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native compiler and KPI logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-macos15-compile-logs
          path: build/ci-logs/
          if-no-files-found: error
          retention-days: 7
