name: build

# Runs on the owner's self-hosted runners (labels: self-hosted + Linux /
# macOS). Kext + host tests run on every push, the Metal plugin and RADV
# only when their sources change (or on a manual run with "full"),
# docs-only pushes run nothing, and a newer push cancels an older run of
# the same branch. No pull_request trigger: fork code never reaches the
# self-hosted machines.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'NOTICE'
      - 'LICENSE*'
      - 'tools/probe/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Build everything (Metal plugin + RADV too)'
        type: boolean
        default: true
      radv:
        description: 'With full off: build RADV + rdna3_vktest too (no Metal plugin)'
        type: boolean
        default: false
      cts:
        description: 'Build the Vulkan CTS subset for step cts (deqp-vk + loader, an hour the first time)'
        type: boolean
        default: false

# a CTS build (an hour) has its own group: a push does not cancel it
concurrency:
  group: build-${{ github.ref }}${{ inputs.cts && '-cts' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: linux
    outputs:
      metal: ${{ steps.f.outputs.metal }}
      radv: ${{ steps.f.outputs.radv }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          RADV: ${{ inputs.radv }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" != "true" ]; then
            echo "metal=false" >> "$GITHUB_OUTPUT"
            [ "$RADV" = "true" ] && echo "radv=true" >> "$GITHUB_OUTPUT" || echo "radv=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FULL" = "true" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "metal=true" >> "$GITHUB_OUTPUT"; echo "radv=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)
          echo "$changed"
          echo "$changed" | grep -qE '^metal/' && echo "metal=true" >> "$GITHUB_OUTPUT" || echo "metal=false" >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -qE '^(userspace/|third_party/libdrm/)' && echo "radv=true" >> "$GITHUB_OUTPUT" || echo "radv=false" >> "$GITHUB_OUTPUT"

  host-tests:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Navi 32 firmware for header tests (not redistributed)
        run: |
          mkdir -p "$RUNNER_TEMP/fw"
          for f in psp_13_0_10_sos psp_13_0_10_ta smu_13_0_10 sdma_6_0_3 gc_11_0_3_imu gc_11_0_3_pfp \
                   gc_11_0_3_me gc_11_0_3_mec gc_11_0_3_rlc gc_11_0_3_mes_2 \
                   gc_11_0_3_mes1 dcn_3_2_0_dmcub vcn_4_0_0; do
            curl -sSfL "https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/amdgpu/$f.bin" \
                 -o "$RUNNER_TEMP/fw/$f.bin" || echo "could not fetch $f"
          done
      - name: Unit tests + fuzz (ASan/UBSan), real firmware headers
        run: make test RDNA3_FW_DIR="$RUNNER_TEMP/fw"
      - name: Firmware load plan
        run: make tools && build/host/amd_fw_dump "$RUNNER_TEMP/fw"
      - name: Host tools
        run: make tools
      - name: README status is up to date
        run: python3 tools/progress.py --check

  kext:
    runs-on: macOS
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - name: Build RDNA3Accel.kext (x86_64)
        run: make -k -C kext   # -k: one run lists every compile error
      - name: Build RDNA3Accelerator.kext (Stage 7, Sequoia and Tahoe layouts)
        run: |
          make -C accel
          make -C accel check
          make -C accel clean && make -C accel NM_TAHOE=1
          # the macOS 26 build next to the other (rdna3vm: OpenCore injects
          # each for its own kernel; the VM installs the one for its Darwin)
          rm -rf build/RDNA3AcceleratorTahoe.kext
          cp -R build/RDNA3Accelerator.kext build/RDNA3AcceleratorTahoe.kext
          make -C accel clean && make -C accel
      - name: Build RDNA3Framebuffer.kext (Stage 3)
        run: |
          make -C fb
          make -C fb check
      - name: Build RDNA3AGDC.kext (AppleGraphicsDeviceControl for IOPresentment)
        run: |
          make -C agdc
          make -C agdc check
      - name: Inspect
        run: |
          file build/RDNA3Accel.kext/Contents/MacOS/RDNA3Accel
          make -C kext check
      - name: Userspace (libdrm_xnu, rdna3_drminfo, rdna3_modetest, rdna3_pmctl)
        run: make -C userspace
      - name: rdna3_vktest + mtlprobe (bundled into the VM's report bin)
        continue-on-error: true
        run: make -C userspace probes
      - name: Host tests on macOS
        run: make test tools
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: RDNA3Accel-kext
          path: |
            build/RDNA3Accel.kext
            build/RDNA3Accelerator.kext
            build/RDNA3AcceleratorTahoe.kext
            build/RDNA3Framebuffer.kext
            build/RDNA3AGDC.kext
            build/userspace/rdna3_drminfo
            build/userspace/rdna3_modetest
            build/userspace/rdna3_pmctl
            build/userspace/rdna3_vktest
            build/userspace/mtlprobe
            build/userspace/libdrm.dylib
            build/userspace/libdrm_amdgpu.dylib
      # seconds: pkgbuild over the files above, no firmware inside
      # (package/make_pkg.sh; the Metal plugin and RADV are added locally)
      # the package TESTING-HW.md has users install: a broken build fails
      # the run (PR #2 review)
      - name: Installer (.pkg + tarball)
        run: package/make_pkg.sh --out build/pkg
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: RDNA3-pkg
          path: build/pkg/
          if-no-files-found: error

  metal:
    needs: changes
    if: needs.changes.outputs.metal == 'true'
    runs-on: macOS
    steps:
      - uses: actions/checkout@v4
      - name: Metal plugin (RDNA3MTLDriver.bundle)
        run: make -C metal plugin
      - name: AIR->SPIR-V translator (librdna3mtl_translate.dylib)
        run: |
          # rustup into ~/.cargo on first use (no Homebrew on Intel Macs),
          # a pinned release checked by SHA-256. The runner is x86_64, so
          # cargo's host target is the one the plugin loads.
          tools/ci/install_tools.sh rustup
          export PATH="$HOME/.cargo/bin:$PATH"
          make -C metal translator
          lipo -archs build/metal/librdna3mtl_translate.dylib | grep -qw x86_64
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: RDNA3MTL
          path: |
            build/metal/RDNA3MTLDriver.bundle
            build/metal/librdna3mtl_translate.dylib

  translator:
    # The Metal translator's own tests (metal/translator/translator/tests),
    # no GPU and no Mac needed: every test file whose fixtures are imported
    # (the ones reading ../validation/ are not). They check each module with
    # SPIRV-Tools, built here once and kept in the runner's tool cache.
    needs: changes
    if: needs.changes.outputs.metal == 'true'
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: Tools (rustup, cmake / ninja from PyPI, SPIRV-Tools from source)
        run: |
          T="$RUNNER_TOOL_CACHE/rdna3-translator"
          mkdir -p "$T"
          command -v cargo >/dev/null || tools/ci/install_tools.sh rustup
          tools/ci/install_tools.sh uv
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          [ -x "$T/venv/bin/python3" ] || uv venv --python 3.12 "$T/venv"
          uv pip install --python "$T/venv/bin/python3" --quiet cmake ninja
          export PATH="$T/venv/bin:$PATH"
          if [ ! -x "$T/bin/spirv-val" ]; then
            rm -rf "$T/spirv-tools"
            git -c advice.detachedHead=false clone -q --depth 1 --branch vulkan-sdk-1.4.321.0 \
              https://github.com/KhronosGroup/SPIRV-Tools.git "$T/spirv-tools"
            git -c advice.detachedHead=false clone -q --depth 1 --branch vulkan-sdk-1.4.321.0 \
              https://github.com/KhronosGroup/SPIRV-Headers.git "$T/spirv-tools/external/spirv-headers"
            cmake -S "$T/spirv-tools" -B "$T/spirv-tools/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF -DCMAKE_INSTALL_PREFIX="$T" >/dev/null
            ninja -C "$T/spirv-tools/build" install >/dev/null
          fi
          cargo --version; "$T/bin/spirv-val" --version | head -1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$T/bin" >> "$GITHUB_PATH"
          echo "XLATE_TARGET=$T/target" >> "$GITHUB_ENV"
      - name: Translator tests
        working-directory: metal/translator/translator
        run: |
          t=""
          for f in $(grep -L 'validation/' tests/*.rs); do
            n=$(basename "$f" .rs)
            [ "$n" = leaf_memcpy_interior_field ] || t="$t --test $n"
          done
          cargo test --release --target-dir "$XLATE_TARGET" --no-fail-fast $t
      - name: leaf_memcpy_interior_field (fails as imported, not counted)
        # Upstream's own failure: with METAL2VULKAN_NO_LEAF_MEMCPY set the
        # module is refused, but as "unresolved external shader function:
        # llvm.memcpy..." where the test expects "OpFunctionCall". Shown
        # here so a change in it is seen.
        continue-on-error: true
        working-directory: metal/translator/translator
        run: cargo test --release --target-dir "$XLATE_TARGET" --test leaf_memcpy_interior_field

  cts-macos:
    # The Vulkan CTS subset of the card report (V2): deqp-vk + the Khronos
    # loader for the macOS VM, on request only. The clones and build trees
    # stay in the runner's tool cache, so a rebuild is quick. The artifact
    # goes to the VM with `rdna3vm cts`; step cts runs it.
    if: inputs.cts
    runs-on: macOS
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Python 3.12 venv with cmake + ninja, as radv-macos)
        run: |
          T="$RUNNER_TOOL_CACHE/rdna3-radv"
          mkdir -p "$T"
          tools/ci/install_tools.sh uv
          export PATH="$HOME/.local/bin:$PATH"
          [ -x "$T/venv/bin/python3" ] || uv venv --python 3.12 "$T/venv"
          uv pip install --python "$T/venv/bin/python3" --quiet cmake ninja certifi
          echo "$T/venv/bin" >> "$GITHUB_PATH"
      - name: Build deqp-vk + the loader
        run: tools/ci/build_cts.sh build/cts-out "$RUNNER_TOOL_CACHE/rdna3-cts"
      - name: deqp-vk starts without a driver (lists the smoke cases)
        run: |
          d=$(mktemp -d)
          tar -xzf build/cts-out/rdna3-cts.tar.gz -C "$d"
          cd "$d/cts"
          file deqp-vk libvulkan.1.dylib
          ./deqp-vk --deqp-runmode=stdout-caselist --deqp-case='dEQP-VK.api.smoke.*' | head -20
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: rdna3-cts
          path: build/cts-out/rdna3-cts.tar.gz
          retention-days: 30

  radv-macos:
    # Experimental: drives the Stage 5 port. Failures here are the to-do list.
    # Builds x86_64 (-arch x86_64).
    needs: changes
    if: needs.changes.outputs.radv == 'true'
    runs-on: macOS
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Tools (no Homebrew, it no longer installs on Intel Macs)
        run: |
          # As tools/vm/macos/build_radv.sh: Python 3.12 (through uv, Xcode's
          # is 3.9) with the build tools from PyPI in a venv, glslang from
          # source. Kept in the runner's tool cache, so only the first run
          # downloads and builds them.
          T="$RUNNER_TOOL_CACHE/rdna3-radv"
          mkdir -p "$T"
          tools/ci/install_tools.sh uv   # pinned, checked by SHA-256
          export PATH="$HOME/.local/bin:$PATH"
          [ -x "$T/venv/bin/python3" ] || uv venv --python 3.12 "$T/venv"
          uv pip install --python "$T/venv/bin/python3" --quiet meson ninja mako pyyaml packaging pkgconf cmake
          export PATH="$T/venv/bin:$T/bin:$PATH"
          if ! command -v glslangValidator >/dev/null; then
            rm -rf "$T/glslang"
            git -c advice.detachedHead=false clone -q --depth 1 --branch 15.1.0 \
              https://github.com/KhronosGroup/glslang.git "$T/glslang"
            cmake -S "$T/glslang" -B "$T/glslang/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF \
              -DGLSLANG_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$T" >/dev/null
            ninja -C "$T/glslang/build" install >/dev/null
          fi
          python3 --version; meson --version; glslangValidator --version | head -1
          echo "$T/venv/bin" >> "$GITHUB_PATH"
          echo "$T/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG=$T/venv/bin/pkgconf" >> "$GITHUB_ENV"
      - name: Build RADV against libdrm_xnu
        run: userspace/mesa/build_radv.sh build/mesa
      - name: rdna3_vktest (the VM runs it against the card from step 8)
        run: |
          mkdir -p build/mesa/install/bin
          xcrun clang -O1 -g -arch x86_64 -mmacosx-version-min=15.0 -std=gnu11 -Wall -Wextra -Werror \
            -I build/mesa/src/include -o build/mesa/install/bin/rdna3_vktest userspace/rdna3_vktest.c
      - name: vulkaninfo on the in-process UAPI (loopback libdrm, no kext)
        if: always()
        # build 167 hung here for 1.5 h (no log while it ran) and held the
        # macOS runner; a diagnostic step must not decide the build
        timeout-minutes: 10
        continue-on-error: true
        run: |
          make -C userspace loopback
          cp build/userspace/libdrm_loopback.dylib build/userspace/prefix/lib/libdrm.2.dylib
          export VK_ICD_FILENAMES="$PWD/build/mesa/install/share/vulkan/icd.d/radeon_icd.x86_64.json"
          export VK_LOADER_DEBUG=error,warn
          export DRM_XNU_TRACE=1
          # vulkaninfo needs the Vulkan loader (e.g. the LunarG SDK); without
          # one, rdna3_vktest below loads RADV directly
          if command -v vulkaninfo >/dev/null; then
            vulkaninfo --summary 2>&1 | tee build/mesa/vulkaninfo.log | head -120
            grep -q "RADV" build/mesa/vulkaninfo.log && echo "RADV enumerated through the loopback UAPI" || echo "vulkaninfo did not enumerate RADV (see log)"
          else
            echo "no vulkaninfo on this runner: skipped"
          fi
          build/mesa/install/bin/rdna3_vktest --loopback build/mesa/install/lib/libvulkan_radeon.dylib 2>&1 \
            | tee build/mesa/vktest.log || true
      - name: Error summary
        if: always()
        run: |
          grep -E "error:|ERROR:|meson.build:[0-9]+:[0-9]+: ERROR" build/mesa/meson-setup.log build/mesa/ninja.log 2>/dev/null | sort | uniq -c | sort -rn | head -80 || true
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: radv-macos-logs
          path: |
            build/mesa/meson-setup.log
            build/mesa/ninja.log
            build/mesa/install/lib/libvulkan_radeon.dylib
            build/mesa/install/bin/rdna3_vktest
            build/mesa/install/share/vulkan/icd.d
            build/mesa/missing.txt
            build/mesa/weak.txt
            build/mesa/vulkaninfo.log
            build/mesa/vktest.log
