name: macOS 15 Intel accelerator symbol-name probe (no binaries)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  accel-symbol-probe:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require native Intel macOS 15 and exact Xcode 16.4 / SDK 15.5
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/macos15-accel-symbol-probe-logs"
          mkdir "$logs"
          printf '%s\n' \
            'EXPERIMENTAL SYMBOL-NAME PROBE ONLY; NOT DRIVER OR HARDWARE VALIDATION.' \
            'Normal control and an isolated same-commit source copy; only four typedefs become opaque unsigned enums.' \
            'No enumerators, macOS 26 vtable slots, production header changes or baseline manifest updates.' \
            'No KC creation, installation, kext loading, firmware download, USB or EFI access.' \
            'Only logs, small JSON, public source patch and source/scope text are uploaded; no kext or Apple binaries.' \
            'Even a matching name/provider does NOT prove ABI/vtable, boot, graphics or RX 7600 XT support.' \
            | tee "$logs/SCOPE.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' \
            "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'Source/attribution: accel/PROVENANCE.md, LICENSE, NOTICE; original header SPDX: PolyForm-Noncommercial-1.0.0.' \
            'Hypothesis origin: macOS 15 Intel run 41880017271 / job 126749743304 had 914 imports, 907 resolved, seven unresolved.' \
            'Old evidence only identifies the question; this run must measure current imports and current providers again.' \
            > "$logs/SOURCE.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uname -m | tee "$logs/toolchain.log"
          sw_vers 2>&1 | tee -a "$logs/toolchain.log"
          kernel="$(uname -r)"
          osrelease="$(sysctl -n kern.osrelease)"
          printf 'Host kernel (uname -r): %s\nHost kernel (kern.osrelease): %s\n' "$kernel" "$osrelease" | tee -a "$logs/toolchain.log"
          printf '%s\n' 'The guard also checks the newest repository XNU policy list; its tag is NOT the host kernel version.' | tee -a "$logs/toolchain.log"
          xcodebuild -version 2>&1 | tee -a "$logs/toolchain.log"
          xcrun --sdk macosx --show-sdk-version 2>&1 | tee -a "$logs/toolchain.log"
          xcrun --sdk macosx --show-sdk-path 2>&1 | tee -a "$logs/toolchain.log"
          xcrun clang --version 2>&1 | tee -a "$logs/toolchain.log"
          printf 'Image: %s %s\n' "$ImageOS" "$ImageVersion" | tee -a "$logs/toolchain.log"
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          test "$kernel" = "$osrelease"
          test "${kernel%%.*}" = 24
          grep -qx 'Xcode 16.4' "$logs/toolchain.log"
          grep -qx 'Build version 16F6' "$logs/toolchain.log"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.5
          test -d "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/Kernel.framework/Headers"
      - name: Test source-copy and exact seven-symbol checks
        run: python3 -I -B tools/ci/test_macos15_accel_symbol_probe.py 2>&1 | tee "$RUNNER_TEMP/macos15-accel-symbol-probe-logs/selftests.log"
      - name: Build normal accelerator control and measure native providers
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/macos15-accel-symbol-probe-logs"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          make -C accel all check SDK="$sdk" ARCH='-arch x86_64 -mmacosx-version-min=11.0' 2>&1 | tee "$logs/baseline-build.log"
          bundle="$(pwd -P)/build/RDNA3Accelerator.kext"
          test "$(xcrun lipo -archs "$bundle/Contents/MacOS/RDNA3Accelerator")" = x86_64
          xcrun nm -arch x86_64 -u "$bundle/Contents/MacOS/RDNA3Accelerator" > "$logs/baseline-nm.log"
          kmutil libraries -p "$bundle" --undef-symbols > "$logs/baseline-kmutil.log" 2> "$logs/baseline-kmutil-stderr.log"
      - name: Archive the same commit and patch only the exclusive temporary copy
        id: candidate
        run: |
          set -euo pipefail
          source="$(mktemp -d "$RUNNER_TEMP/macos15-accel-symbol-probe.XXXXXX")"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source"
          python3 -B tools/ci/macos15_accel_symbol_probe.py patch "$source" "$RUNNER_TEMP/macos15-accel-symbol-probe-logs"
          git diff --exit-code -- accel/iofam/iofam_types.h
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
      - name: Build opaque-enum candidate and measure native providers
        env:
          PROBE_SOURCE: ${{ steps.candidate.outputs.source }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/macos15-accel-symbol-probe-logs"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          make -C "$PROBE_SOURCE/accel" all check SDK="$sdk" ARCH='-arch x86_64 -mmacosx-version-min=11.0' 2>&1 | tee "$logs/candidate-build.log"
          bundle="$(cd "$PROBE_SOURCE" && pwd -P)/build/RDNA3Accelerator.kext"
          test "$(xcrun lipo -archs "$bundle/Contents/MacOS/RDNA3Accelerator")" = x86_64
          xcrun nm -arch x86_64 -u "$bundle/Contents/MacOS/RDNA3Accelerator" > "$logs/candidate-nm.log"
          kmutil libraries -p "$bundle" --undef-symbols > "$logs/candidate-kmutil.log" 2> "$logs/candidate-kmutil-stderr.log"
      - name: Require exactly seven replacements and the strict current candidate KPI guard
        env:
          PROBE_SOURCE: ${{ steps.candidate.outputs.source }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/macos15-accel-symbol-probe-logs"
          python3 -B tools/ci/macos15_accel_symbol_probe.py check "$PWD" "$PROBE_SOURCE" "$logs" 2>&1 | tee "$logs/comparison.log"
          cat "$logs/comparison.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve only probe logs, small JSON and the public source patch (never binaries)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos15-accel-symbol-probe-NAMES-ONLY-NO-BINARIES
          path: |
            ${{ runner.temp }}/macos15-accel-symbol-probe-logs/*.log
            ${{ runner.temp }}/macos15-accel-symbol-probe-logs/result.json
            ${{ runner.temp }}/macos15-accel-symbol-probe-logs/candidate-header.patch
            ${{ runner.temp }}/macos15-accel-symbol-probe-logs/SCOPE.txt
            ${{ runner.temp }}/macos15-accel-symbol-probe-logs/SOURCE.txt
          if-no-files-found: error
          retention-days: 7
