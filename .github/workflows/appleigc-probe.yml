name: AppleIGC I226 INTx diagnostic (build and temporary KC)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IGC_COMMIT: 8802cba391e68ad66fdabacc7a0f5e9e0cd61597
      SDK_COMMIT: c41d877b64e7fd916bd271390bcdf30f7deb7b7a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve verification sources
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/igc-artifact"
          mkdir -p "$dist/support/appleigc" "$dist/tools/ci/data" "$dist/tools/probe"
          cp support/appleigc/verify_probe.py support/appleigc/test_verify_probe.py "$dist/support/appleigc/"
          cp tools/ci/kmutil_kpi_guard.py tools/ci/macos15_native_contract.py "$dist/tools/ci/"
          cp tools/ci/data/xnu-*-x86_64-private-only.txt tools/ci/data/xnu-*-x86_64-unsupported-only.txt "$dist/tools/ci/data/"
          cp tools/probe/kc_func.py "$dist/tools/probe/"
      - name: Fetch and verify reviewed public sources
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sw_vers | tee "$RUNNER_TEMP/runner-os.txt"
          uname -a | tee -a "$RUNNER_TEMP/runner-os.txt"
          sw_vers -productVersion | grep -E '^15[.]'
          xcodebuild -version | tee "$RUNNER_TEMP/xcode.txt"
          grep -qx 'Xcode 16.4' "$RUNNER_TEMP/xcode.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 180 \
            "https://codeload.github.com/SongXiaoXi/AppleIGC/zip/$IGC_COMMIT" -o "$RUNNER_TEMP/AppleIGC-source.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 180 \
            "https://codeload.github.com/acidanthera/MacKernelSDK/zip/$SDK_COMMIT" -o "$RUNNER_TEMP/MacKernelSDK-source.zip"
          printf '%s  %s\n' 4050d72f00685990bac2749526704b3b4427a7b783ebda47d8cd87726006bd53 "$RUNNER_TEMP/AppleIGC-source.zip" | shasum -a 256 -c -
          printf '%s  %s\n' 4fc58fe0cbc2611e5a32365308ca273bf03cb1dd7e564a5f2c9d128352512a8b "$RUNNER_TEMP/MacKernelSDK-source.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/AppleIGC-source.zip" -d "$RUNNER_TEMP/igc"
          unzip -q "$RUNNER_TEMP/MacKernelSDK-source.zip" -d "$RUNNER_TEMP/sdk"
          src="$RUNNER_TEMP/igc/AppleIGC-$IGC_COMMIT"
          ditto "$RUNNER_TEMP/sdk/MacKernelSDK-$SDK_COMMIT" "$src/MacKernelSDK"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 120 \
            https://github.com/SongXiaoXi/AppleIGC/releases/download/v1.9/AppleIGC.kext.zip -o "$RUNNER_TEMP/AppleIGC-official-v1.9.zip"
          printf '%s  %s\n' 3398c5cf609b26be9485445c4f10fe2ef2c43554db1c25f406d8bc955c399466 "$RUNNER_TEMP/AppleIGC-official-v1.9.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/AppleIGC-official-v1.9.zip" -d "$RUNNER_TEMP/igc-official"
          git -c core.autocrlf=false -C "$src" apply --check "$GITHUB_WORKSPACE/support/appleigc/intx-probe.patch"
          git -c core.autocrlf=false -C "$src" apply "$GITHUB_WORKSPACE/support/appleigc/intx-probe.patch"
      - name: Exact source predicate and diagnostic safety contracts
        run: |
          set -euo pipefail
          python3 -I support/appleigc/test_probe.py "$RUNNER_TEMP/igc/AppleIGC-$IGC_COMMIT" 2>&1 | tee "$RUNNER_TEMP/probe-tests.txt"
          python3 -B support/appleigc/test_verify_probe.py 2>&1 | tee "$RUNNER_TEMP/verify-probe-tests.txt"
      - name: Native x86_64 build (never install or load)
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/igc/AppleIGC-$IGC_COMMIT/AppleIGC.xcodeproj" \
            -target AppleIGC -configuration Release -sdk macosx ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            CURRENT_PROJECT_VERSION=1.9d2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SYMROOT="$RUNNER_TEMP/igc-products" OBJROOT="$RUNNER_TEMP/igc-objects" build \
            2>&1 | tee "$RUNNER_TEMP/igc-build.txt"
      - name: Verify identity, signature and native imports; preserve reproducible sources
        run: |
          set -euo pipefail
          kext="$RUNNER_TEMP/igc-products/Release/AppleIGC.kext"
          bin="$kext/Contents/MacOS/AppleIGC"
          dist="$RUNNER_TEMP/igc-artifact"
          mkdir -p "$dist"
          test "$(lipo -archs "$bin")" = x86_64
          codesign --force --sign - --timestamp=none "$kext"
          codesign --verify --strict --verbose=2 "$kext" 2>&1 | tee "$dist/probe-signature-verify.txt"
          xcrun dwarfdump --uuid "$bin" | tee "$dist/probe-uuid.txt"
          plutil -lint "$kext/Contents/Info.plist"
          python3 - "$kext/Contents/Info.plist" <<'PY'
          import plistlib, sys
          p=plistlib.load(open(sys.argv[1], 'rb'))
          assert p['CFBundleIdentifier']=='com.sxx.AppleIGC'
          assert p['CFBundleVersion']=='1.9d2'
          assert p['IOKitPersonalities']['i226']['IOClass']=='AppleIGC'
          assert '0x125c8086' in p['IOKitPersonalities']['i226']['IOPCIMatch'].split()
          assert p['IOKitPersonalities']['i226']['NETIF_F_TSO'] is True
          PY
          strings "$bin" | grep -F 'i226-intx-probe-8802cba'
          # Retain the strict verdict, then require baseline parity and real KC links.
          set +e
          python3 tools/ci/kmutil_kpi_guard.py "$kext" 2>&1 | tee "$dist/native-kpi-check.txt"
          guard_status=("${PIPESTATUS[@]}")
          set -e
          echo "STRICT_NAME_GUARD_EXIT=${guard_status[0]}" | tee "$dist/name-guard-status.txt"
          test "${guard_status[1]}" -eq 0
          case "${guard_status[0]}" in 0|1) ;; *) exit "${guard_status[0]}" ;; esac
          official="$RUNNER_TEMP/igc-official/AppleIGC.kext"
          codesign --force --sign - --timestamp=none "$official"
          codesign --verify --strict --verbose=2 "$official" 2>&1 | tee "$dist/official-signature-verify.txt"
          python3 -B support/appleigc/verify_probe.py native "$official" "$kext" 2>&1 | tee "$dist/native-parity.txt"
          otool -hv "$bin" > "$dist/mach-header.txt"
          otool -L "$bin" > "$dist/dylib-dependencies.txt"
          test -z "$(tail -n +2 "$dist/dylib-dependencies.txt")"
          nm -u "$bin" > "$dist/undefined-symbols.txt"
          kmutil create --help > "$dist/kmutil-create-help.txt" 2>&1
          boot=/System/Library/KernelCollections/BootKernelExtensions.kc
          system=/System/Library/KernelCollections/SystemKernelExtensions.kc
          test -f "$boot"
          test -f "$system"
          kc_failed=0
          for variant in official probe; do
            if test "$variant" = official; then input="$official"; else input="$kext"; fi
            # Third-party AuxKC fixture omits the boot requirement; production remains Root.
            fixture="$RUNNER_TEMP/igc-kc-input-$variant/AppleIGC.kext"
            ditto "$input" "$fixture"
            python3 - "$fixture/Contents/Info.plist" <<'PY'
          import pathlib, plistlib, sys
          p=pathlib.Path(sys.argv[1]); info=plistlib.loads(p.read_bytes())
          assert info['OSBundleRequired']=='Root'
          del info['OSBundleRequired']
          p.write_bytes(plistlib.dumps(info,sort_keys=False))
          PY
            codesign --force --sign - --timestamp=none "$fixture"
            codesign --verify --strict --verbose=2 "$fixture"
            python3 - "$input" "$fixture" <<'PY' | tee "$dist/link-fixture-$variant.txt"
          import pathlib, plistlib, struct, sys
          sys.path.insert(0,'support/appleigc')
          from verify_probe import checked_commands
          original, fixture = map(pathlib.Path,sys.argv[1:])
          p=plistlib.loads((original/'Contents/Info.plist').read_bytes())
          q=plistlib.loads((fixture/'Contents/Info.plist').read_bytes())
          assert p['OSBundleRequired']=='Root' and 'OSBundleRequired' not in q
          q['OSBundleRequired']='Root'
          assert p==q, 'fixture changed metadata other than collection placement'
          def parts(path):
              b=path.read_bytes(); commands,_=checked_commands(b,0,11)
              sig=[(pos,size) for cmd,pos,size in commands if cmd==0x1d]
              assert len(sig)==1 and sig[0][1]==16
              offset,size=struct.unpack_from('<II',b,sig[0][0]+8)
              assert 0<offset and offset+size<=len(b)
              return (offset,size,b[:offset],b[offset+size:])
          assert parts(original/'Contents/MacOS/AppleIGC')==parts(fixture/'Contents/MacOS/AppleIGC'), 'link fixture changed Mach-O outside signature data'
          print('Link fixture only: omit Root boot requirement, original unchanged, Mach-O outside signature data byte-identical.')
          PY
            output="$RUNNER_TEMP/igc-kc-$variant/AuxiliaryKernelExtensions.kc"
            mkdir -p "$(dirname "$output")"
            set +e
            sudo kmutil create --verbose --new aux --volume-root / --boot-path "$boot" --system-path "$system" \
              --auxiliary-path "$output" --bundle-path "$fixture" --variant-suffix release \
              --no-variant-extension --explicit-only --no-authorization --allow-missing-kdk \
              2>&1 | tee "$dist/kc-$variant.txt"
            kc_status=("${PIPESTATUS[@]}")
            set -e
            echo "KC_$variant=${kc_status[0]}" | tee -a "$dist/kc-status.txt"
            if test "${kc_status[0]}" -ne 0 || test "${kc_status[1]}" -ne 0 || ! test -s "$output"; then kc_failed=1; continue; fi
            if ! python3 -B support/appleigc/verify_probe.py kc "$output" "$variant" 2>&1 | tee "$dist/kc-$variant-verify.txt"; then
              kc_failed=1
            fi
          done
          test "$kc_failed" = 0
          ditto "$kext" "$dist/AppleIGC.kext"
          cp "$RUNNER_TEMP/AppleIGC-source.zip" "$RUNNER_TEMP/MacKernelSDK-source.zip" "$RUNNER_TEMP/AppleIGC-official-v1.9.zip" "$dist/"
          cp support/appleigc/intx-probe.patch support/appleigc/test_probe.py "$dist/"
          cp "$RUNNER_TEMP/xcode.txt" "$RUNNER_TEMP/probe-tests.txt" "$RUNNER_TEMP/verify-probe-tests.txt" "$RUNNER_TEMP/igc-build.txt" "$RUNNER_TEMP/runner-os.txt" "$dist/"
          printf '%s\n' \
            'EXPERIMENTAL I226 IRQ DIAGNOSTIC; NOT A VERIFIED NETWORK FIX.' \
            'Only select source 0 when IOKit confirms a non-messaged source. Otherwise initialization refuses.' \
            'AppleIGC upstream: 8802cba391e68ad66fdabacc7a0f5e9e0cd61597; SDK: c41d877b64e7fd916bd271390bcdf30f7deb7b7a.' \
            "Overlay commit: $GITHUB_SHA" \
            'The early source-0 guard does not audit subsequent upstream failure paths.' \
            'Ad-hoc signature verification checks local integrity, not Apple approval or trust.' \
            'Strict name-level output is retained; metadata and import parity is not full symbol resolution.' \
            'Both code-link fixtures linked into new temporary Aux KCs and their AppleIGC members were checked.' \
            'Fixtures ONLY: OSBundleRequired Root omitted; Mach-O outside signature data is byte-identical. Distributed driver retains original Root placement.' \
            'This does NOT validate BootKC placement or actual OpenCore injection; it validates code linking against the runner dependencies.' \
            'No kext was installed or loaded; KC output paths are new runner-temporary directories.' \
            'KC links do not validate hardware, DHCP, wake or stability; kmutil may have other cache side effects.' \
            'No EFI, device identity, VBIOS, reports or credentials are included.' \
            'Upstream per-file licence notices are retained in the complete source archives; no relicensing.' \
            > "$dist/BUILD-SCOPE.txt"
          (cd "$dist" && shasum -a 256 AppleIGC.kext/Contents/MacOS/AppleIGC AppleIGC.kext/Contents/Info.plist > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: appleigc-i226-intx-probe-x86_64
          path: ${{ runner.temp }}/igc-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: appleigc-intx-probe-failure-logs
          path: |
            ${{ runner.temp }}/igc-build.txt
            ${{ runner.temp }}/probe-tests.txt
            ${{ runner.temp }}/verify-probe-tests.txt
            ${{ runner.temp }}/xcode.txt
            ${{ runner.temp }}/runner-os.txt
            ${{ runner.temp }}/igc-artifact/
            ${{ runner.temp }}/igc-products/Release/AppleIGC.kext/
          if-no-files-found: warn
          retention-days: 7
