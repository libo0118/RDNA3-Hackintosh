name: probe

# One-off investigations on the owner's self-hosted macOS runner: runs when
# a script under tools/probe/ changes (never on GitHub-hosted runners).
on:
  push:
    paths:
      - 'tools/probe/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coredisplay:
    runs-on: macOS
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: CoreDisplay / SkyLight / IOPresentment disassembly
        run: |
          sh tools/probe/coredisplay.sh probe-out
          cat probe-out/00-system.txt
          # dyld_info's own complaints, per library (an empty disassembly makes every later file empty)
          for f in probe-out/*.err; do [ -f "$f" ] || continue; echo "== $f"; head -n 40 "$f"; done
          grep -n '^FAILED' probe-out/00-system.txt || true
          # show LABEL FILE LINES: a file that is missing is said, it does not abort the step (bash -e)
          show() { if [ -f "$2" ]; then echo "== $1"; head -n "$3" "$2"; else echo "== $1: MISSING $2"; fi; }
          show "assertion and pipe strings" probe-out/20-CoreDisplay-strings.txt 200
          show "IOPresentment strings" probe-out/21-IOPresentment-strings.txt 100
          show "copy forward strings and exports" probe-out/22-copy-forward-strings.txt 400
          show "IOAccelSetSurfaceFramebufferShape" probe-out/15-IOAccelSetSurfaceFramebufferShape.s 600
          show "copy_forward_region callers" probe-out/16-copy-forward-callers.s 4000
          show "CGXDisplayCreateCopyForwardShape callers" probe-out/17-copy-forward-shape-callers.s 3000
          show "present mode: keyword strings" probe-out/30-keyword-strings.txt 400
          show "present mode: the function that logs the page flip mode" probe-out/40-page-flip-fn-CoreDisplay.s 1500
          show "present mode: the same, found by the address of the string" probe-out/40-page-flip-fn-CoreDisplay-by-address.s 1500
          show "present mode: callers" probe-out/41-page-flip-callers.s 3000
          show "present mode: strings, calls and keys those read" probe-out/42-page-flip-keys.txt 600
          show "present mode: callers' callers" probe-out/41-page-flip-callers2.s 2000
          # the real switch (page flip mode is a constant): CoreDisplay::UseIOPresentment and what feeds it
          show "switch: CoreDisplay::UseIOPresentment" probe-out/50-UseIOPresentment.s 400
          show "switch: UseIOPresentment callees" probe-out/50-UseIOPresentment-callees.s 1200
          show "switch: UseIOPresentment callees of the small callees" probe-out/50-UseIOPresentment-callees2.s 600
          show "switch: UseIOPresentment strings, calls, reads" probe-out/50-UseIOPresentment-keys.txt 300
          show "switch: users of displayPipeIsAvailable (CoreDisplay)" probe-out/51-CoreDisplay-str-displayPipeIsAvailable.s 500
          show "switch: users of IOPRESENTMENT_CAPABILITIES_AGDCEXTENDED_MISSING (CoreDisplay)" probe-out/51-CoreDisplay-str-IOPRESENTMENT_CAPABILITIES_AGDCEXTENDED_MISSING.s 500
          show "switch: CoreDisplay::InitializeDisplayPipes" probe-out/52-CoreDisplay-InitializeDisplayPipes.s 700
          show "switch: CoreDisplay::DisplayPipeForService" probe-out/52-CoreDisplay-DisplayPipeForService.s 500
          show "switch: IOPresentment copy capabilities" probe-out/53-IOPresentment-CopyCapabilities.s 500
          show "switch: IOPresentmentInit" probe-out/53-IOPresentment-Init.s 300
          show "switch: IOPresentment users of the string ioPresentmentFindAGDCMatch" probe-out/53-IOPresentment-str-ioPresentmentFindAGDCMatch.s 500
          show "switch: IOPresentment users of DisplayPipeSupported" probe-out/53-IOPresentment-str-DisplayPipeSupported.s 300
          show "switch: IOPresentment users of TransactionsSupported" probe-out/53-IOPresentment-str-TransactionsSupported.s 300
          show "switch: IOPresentment users of AGDC Extended Capabilities not found" probe-out/53-IOPresentment-str-AGDC_Extended_Capabilities_not_found.s 300
          show "switch: isMobileSystem" probe-out/54-isMobileSystem.s 150
          show "switch: isMobileSystem callees" probe-out/54-isMobileSystem-callees.s 300
          show "switch: functions using isMobile (CoreDisplay)" probe-out/43-fn-CoreDisplay-isMobile.s 300
          # run 10: how GetSystemGPUVendors classifies a framebuffer (vendor bit 1 is never allowed), who writes useIOP*
          show "run 10: GetSystemGPUVendors (every function whose label matches, the block invoke included)" probe-out/55-GetSystemGPUVendors.s 500
          show "run 10: GetSystemGPUVendors blocks (block literal -> invoke function)" probe-out/55-GetSystemGPUVendors-blocks.s 600
          show "run 10: GetSystemGPUVendors callees" probe-out/55-GetSystemGPUVendors-callees.s 1200
          show "run 10: GetSystemGPUVendors strings, calls, reads" probe-out/55-GetSystemGPUVendors-keys.txt 200
          show "run 10: functions referencing useIOP*" probe-out/56-useIOP-users.s 1200
          show "run 10: useIOP users, callees" probe-out/56-useIOP-callees.s 600
          show "run 10: useIOP users, strings, calls, reads" probe-out/56-useIOP-keys.txt 250
          show "run 10: CFSTR keys of the functions above (address, text)" probe-out/57-cfstr-resolved.txt 400
          show "run 10: IOP / vendor strings of CoreDisplay and SkyLight" probe-out/58-cstring-iop.txt 150
          # the raw section format the CFSTR / block resolver parses (the artifact cannot be fetched from the session)
          show "run 10: raw __cfstring dump (format check)" probe-out/CoreDisplay.cfstring 40
          show "run 10: raw __const dump (format check)" probe-out/CoreDisplay.const 40
          # loud failure: a CoreDisplay disassembly this small is an error, not a result
          n=0; [ -f probe-out/CoreDisplay.dis ] && n=$(wc -l < probe-out/CoreDisplay.dis | tr -d ' ')
          if [ "$n" -lt 1000 ]; then
            echo "::error::CoreDisplay.dis has $n lines (< 1000): dyld_info produced no disassembly, see the .err files above"
            exit 1
          fi
      - name: CoreDisplay GPU vendor CFSTRs and useIOP defaults (cfstr_peek)
        if: always()
        run: |
          mkdir -p probe-out
          # The addresses below are unslid dyld shared cache addresses of macOS build 24H32 ONLY
          # (probe run 10): the CFSTRs CoreDisplay's GetSystemGPUVendors matches the IOFramebuffer
          # class against (-> IG 2, AMD 4, APV 0x10, NVIDIA 8), the preferences domain
          # (GetBoolCFPreference) and the static initial values of the useIOP* byte flags.
          # The helper is read-only (stdout only) and every step below survives its failure.
          build=$(sysctl -n kern.osversion 2>/dev/null || true)
          echo "macOS build: $build"
          [ "$build" = "24H32" ] || echo "::warning::macOS build is '$build', the cfstr_peek addresses are for 24H32 only"
          show() { if [ -f "$2" ]; then echo "== $1"; head -n "$3" "$2"; else echo "== $1: MISSING $2"; fi; }
          cc -O0 -o probe-out/cfstr_peek tools/probe/cfstr_peek.c -framework CoreFoundation || echo "cfstr_peek build exited $?"
          if [ -x probe-out/cfstr_peek ]; then
            ./probe-out/cfstr_peek \
              s:0x7ff8405067b8 s:0x7ff840502798 s:0x7ff8405067d8 s:0x7ff8404fec98 \
              d:0x7ff8404fd578 \
              b:0x7ff843bac76d b:0x7ff843bac76e b:0x7ff843bad281 b:0x7ff843bad282 b:0x7ff843bad283 \
              w:0x7ff843bb1d64 > probe-out/59-cfstr-peek.txt 2>&1 || echo "cfstr_peek exited $?"
          else
            echo "not found: cfstr_peek was not built" > probe-out/59-cfstr-peek.txt
          fi
          show "run 10: CoreDisplay vendor CFSTRs, domain, useIOP flags, preferences (cfstr_peek)" probe-out/59-cfstr-peek.txt 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-coredisplay
          path: probe-out
          retention-days: 7

  iofam:
    runs-on: macOS
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: IOAccelLegacySurface::clientClose disassembly (card run 50 panic)
        run: |
          sh tools/probe/iofam.sh probe-iofam
          cat probe-iofam/30-iofam-system.txt
          for f in probe-iofam/40-*.txt; do echo "== $f"; head -3000 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-iofam
          path: probe-iofam
          retention-days: 7
