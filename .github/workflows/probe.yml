name: probe

# One-off investigations on the owner's self-hosted macOS runner: runs when
# a script under tools/probe/ changes (never on GitHub-hosted runners).
on:
  push:
    paths:
      - 'tools/probe/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coredisplay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: CoreDisplay / SkyLight / IOPresentment disassembly
        run: |
          sh tools/probe/coredisplay.sh probe-out
          cat probe-out/00-system.txt
          echo "== assertion and pipe strings"; head -200 probe-out/20-CoreDisplay-strings.txt
          echo "== IOPresentment strings"; head -100 probe-out/21-IOPresentment-strings.txt
          echo "== copy forward strings and exports"; cat probe-out/22-copy-forward-strings.txt
          echo "== IOAccelSetSurfaceFramebufferShape"; head -600 probe-out/15-IOAccelSetSurfaceFramebufferShape.s
          echo "== copy_forward_region callers"; head -4000 probe-out/16-copy-forward-callers.s
          echo "== CGXDisplayCreateCopyForwardShape callers"; head -3000 probe-out/17-copy-forward-shape-callers.s
          echo "== present mode: keyword strings"; head -400 probe-out/30-keyword-strings.txt
          echo "== present mode: the function that logs the page flip mode"; head -1500 probe-out/40-page-flip-fn-CoreDisplay.s
          echo "== present mode: the same, found by the address of the string"; head -1500 probe-out/40-page-flip-fn-CoreDisplay-by-address.s
          echo "== present mode: callers"; head -3000 probe-out/41-page-flip-callers.s
          echo "== present mode: strings, calls and keys those read"; head -600 probe-out/42-page-flip-keys.txt
          echo "== present mode: callers' callers"; head -2000 probe-out/41-page-flip-callers2.s
      - uses: actions/upload-artifact@v4
        with:
          name: probe-coredisplay
          path: probe-out
          retention-days: 7

  iofam:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: IOAccelLegacySurface::clientClose disassembly (card run 50 panic)
        run: |
          sh tools/probe/iofam.sh probe-iofam
          cat probe-iofam/30-iofam-system.txt
          for f in probe-iofam/40-*.txt; do echo "== $f"; head -3000 "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: probe-iofam
          path: probe-iofam
          retention-days: 7
